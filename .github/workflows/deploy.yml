name: Build & push web-ui image

# Builds apps/web-ui/Dockerfile and pushes it to ECR. That is the whole job —
# there is deliberately no ECS step in here.
#
# Deploying to ECS needs a cluster and service that the Pulumi compute stack
# creates; that stack is not deployed yet (no ECS cluster exists in the target
# region), so a deploy job here would fail for reasons unrelated to the image.
# Adding it later is a small diff once the infrastructure exists.

on:
  push:
    # ci/github-actions-cd is included temporarily so this workflow can be
    # exercised before it lands on the default branch. GitHub only exposes
    # workflow_dispatch for workflows already on the default branch, so a push
    # trigger on the working branch is the only way to test it end to end.
    # Drop this entry once merged.
    branches: [main, ci/github-actions-cd]
    paths:
      - "apps/web-ui/**"
      - "apps/sdk/**"
      - "libs/**"
      - "prisma/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'chatbot-web-ui' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::704554708141:role/agentfork-github-deploy' }}

jobs:
  build-and-push:
    name: Build & push image
    # Native arm64 runner. The image targets linux/arm64 (Fargate Graviton), and
    # this repo is public, so arm64 runners are free — building natively avoids
    # QEMU, which is slow enough on a Next.js build to hit the job timeout.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-image-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image reference
        id: meta
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          {
            echo "image=${IMAGE}:${SHORT_SHA}"
            echo "latest=${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${SHORT_SHA}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-ui/Dockerfile
          platforms: linux/arm64
          push: true
          # Tagged by commit SHA (immutable, traceable) plus :latest for convenience.
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          # Registry-backed layer cache. Without this every run is a cold build;
          # `cacheFrom: latest` in the old Pulumi path was a no-op because nothing
          # ever pushed a `latest` tag, so the cache reference resolved to nothing.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max
          # Inlined into the client bundle by `next build`, so it must be a build
          # arg — a runtime env var would arrive too late to affect the bundle.
          build-args: |
            NEXT_PUBLIC_MISSION_CONTROL_URL=${{ vars.NEXT_PUBLIC_MISSION_CONTROL_URL || 'http://localhost:3010/mission-control' }}

      - name: Summary
        run: |
          {
            echo "### Pushed to ECR"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}\`"
            echo "- \`${{ steps.meta.outputs.latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
